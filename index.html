<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porbandar Tender & PGVCL AI Assistant</title>
    <style>
        :root {
            --bg-primary: #1e1e24;
            --bg-secondary: #17171c;
            --bg-panel: #26262f;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #10a37f;
            --accent-hover: #0e906f;
            --border: #3f3f46;
            --whatsapp: #25d366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }

        header { background: var(--bg-secondary); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        header h1 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }

        /* Left Panel: AI Chat */
        .chat-panel { width: 40%; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .chat-header { padding: 12px 16px; background: var(--bg-panel); font-size: 0.9rem; font-weight: 600; border-bottom: 1px solid var(--border); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 85%; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; }
        .message.user { background: #2b5c8f; align-self: flex-end; color: white; }
        .message.ai { background: var(--bg-panel); align-self: flex-start; border: 1px solid var(--border); }
        
        .chat-input-area { padding: 12px; border-top: 1px solid var(--border); background: var(--bg-secondary); display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; background: var(--bg-panel); border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 6px; outline: none; font-size: 0.9rem; }
        .chat-input-area button { background: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .chat-input-area button:hover { background: var(--accent-hover); }

        /* Right Panel: Tenders Explorer */
        .tender-panel { width: 60%; display: flex; flex-direction: column; background: var(--bg-primary); }
        .tender-controls { padding: 12px 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .tender-controls input, .tender-controls select { background: var(--bg-panel); border: 1px solid var(--border); color: white; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; outline: none; }
        .tender-controls input { flex: 1; }

        .tender-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .tender-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; transition: 0.2s; }
        .tender-card:hover { border-color: var(--accent); }
        
        .tender-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .tender-title { font-size: 0.95rem; font-weight: 600; color: #fff; }
        .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
        .badge.pgvcl { background: #1e3a8a; color: #93c5fd; }
        .badge.irrigation { background: #065f46; color: #6ee7b7; }
        .badge.rb { background: #78350f; color: #fde68a; }
        .badge.mes { background: #581c87; color: #d8b4fe; }
        .badge.pmc { background: #831843; color: #fbcfe8; }

        .tender-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; font-size: 0.85rem; color: var(--text-muted); }
        .tender-info span strong { color: var(--text-main); }

        .tender-actions { display: flex; gap: 8px; margin-top: 4px; }
        .btn { padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; cursor: pointer; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; border: none; }
        .btn-whatsapp { background: var(--whatsapp); color: #000; }
        .btn-whatsapp:hover { opacity: 0.9; }
        .btn-portal { background: #374151; color: #fff; }
        .btn-portal:hover { background: #4b5563; }

        @media(max-width: 768px) {
            .main-layout { flex-direction: column; }
            .chat-panel, .tender-panel { width: 100%; height: 50vh; }
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Porbandar & PGVCL Tender Tracker AI</h1>
        <span style="font-size: 0.8rem; color: var(--accent);">● Live Verified Data</span>
    </header>

    <div class="main-layout">
        <!-- AI Chat Interface -->
        <div class="chat-panel">
            <div class="chat-header">🤖 AI Tender Assistant</div>
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">Namaste! Main Porbandar aur PGVCL ke tenders par nazar rakhta hoon. Aapko kis department ya project ke baare mein janna hai?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Sawal poochhein (jaise: PGVCL tenders dikhao)..." onkeypress="handleKeyPress(event)">
                <button onclick="sendUserMessage()">Bhejo</button>
            </div>
        </div>

        <!-- Tenders Explorer -->
        <div class="tender-panel">
            <div class="tender-controls">
                <input type="text" id="searchInput" placeholder="Search tenders (e.g. Substation, Barda, Road)..." oninput="filterTenders()">
                <select id="deptFilter" onchange="filterTenders()">
                    <option value="ALL">All Departments</option>
                    <option value="PGVCL">PGVCL</option>
                    <option value="IRRIGATION">Irrigation Dept</option>
                    <option value="R&B">Roads & Buildings</option>
                    <option value="MES">Defence / MES</option>
                    <option value="PMC">Nagarpalika / PMC</option>
                </select>
            </div>
            <div class="tender-list" id="tenderList">
                <!-- Dynamic Tenders Injected Here -->
            </div>
        </div>
    </div>

    <script>
        const tendersData = [
            {
                id: "PGVCL-2026-01",
                title: "Meter Replacement, MMB, Junction Box & Service Works under Kamlabaug Sdn.",
                dept: "PGVCL",
                badgeClass: "pgvcl",
                cost: "₹5,00,000",
                dueDate: "13-Oct-2026",
                link: "https://tender.nprocure.com"
            },
            {
                id: "PGVCL-2026-02",
                title: "AMC of Computer Systems and Peripherals for City Division & Sub-Divisions",
                dept: "PGVCL",
                badgeClass: "pgvcl",
                cost: "₹1,70,000",
                dueDate: "22-Oct-2026",
                link: "https://tender.nprocure.com"
            },
            {
                id: "IRR-2026-03",
                title: "Barada Ghed Integrated Drainage & Water Infrastructure Modernization (Package-3)",
                dept: "IRRIGATION",
                badgeClass: "irrigation",
                cost: "₹115.20 Crore",
                dueDate: "19-Oct-2026",
                link: "https://tender.nprocure.com"
            },
            {
                id: "IRR-2026-04",
                title: "Sorthi Ghed Rubber Dam Installation & River Training Works (Madhuvanti & Minsar)",
                dept: "IRRIGATION",
                badgeClass: "irrigation",
                cost: "₹26.09 Crore",
                dueDate: "04-Nov-2026",
                link: "https://tender.nprocure.com"
            },
            {
                id: "PMC-2026-05",
                title: "Jambuvanti Caves Premises Infrastructure & Tourism Development Works (Ranavav)",
                dept: "PMC",
                badgeClass: "pmc",
                cost: "₹7.19 Crore",
                dueDate: "12-Oct-2026",
                link: "https://tender.nprocure.com"
            },
            {
                id: "PMC-2026-06",
                title: "LED Street Lights Supply, Erection and Maintenance across Ranavav Nagarpalika",
                dept: "PMC",
                badgeClass: "pmc",
                cost: "₹2.64 Crore",
                dueDate: "12-Oct-2026",
                link: "https://tender.nprocure.com"
            },
            {
                id: "MES-2026-07",
                title: "Naval Coast Examination Battery Operational Civil Infrastructure Maintenance",
                dept: "MES",
                badgeClass: "mes",
                cost: "₹25.97 Crore",
                dueDate: "19-Oct-2026",
                link: "https://eprocure.gov.in"
            }
        ];

        function renderTenders(data) {
            const list = document.getElementById('tenderList');
            list.innerHTML = '';
            
            if (data.length === 0) {
                list.innerHTML = '<div style="color:var(--text-muted); text-align:center; margin-top:20px;">Koi tender nahi mila.</div>';
                return;
            }

            data.forEach(t => {
                const card = document.createElement('div');
                card.className = 'tender-card';
                
                // WhatsApp share formatted message
                const waText = encodeURIComponent(`🚨 *Porbandar Tender Alert*\n\n📌 *${t.title}*\n🏢 *Dept:* ${t.dept}\n💰 *Est. Cost:* ${t.cost}\n📅 *Due Date:* ${t.dueDate}\n🔗 *Portal Link:* ${t.link}`);
                const waLink = `https://api.whatsapp.com/send?text=${waText}`;

                card.innerHTML = `
                    <div class="tender-top">
                        <span class="tender-title">${t.title}</span>
                        <span class="badge ${t.badgeClass}">${t.dept}</span>
                    </div>
                    <div class="tender-info">
                        <span>Estimated Cost: <strong>${t.cost}</strong></span>
                        <span>Due Date: <strong>${t.dueDate}</strong></span>
                    </div>
                    <div class="tender-actions">
                        <a href="${waLink}" target="_blank" class="btn btn-whatsapp">💬 WhatsApp Share</a>
                        <a href="${t.link}" target="_blank" class="btn btn-portal">🌐 View Portal</a>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function filterTenders() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const dept = document.getElementById('deptFilter').value;

            const filtered = tendersData.filter(t => {
                const matchesQuery = t.title.toLowerCase().includes(query) || t.dept.toLowerCase().includes(query);
                const matchesDept = (dept === 'ALL' || t.dept === dept);
                return matchesQuery && matchesDept;
            });

            renderTenders(filtered);
        }

        function sendUserMessage() {
            const input = document.getElementById('chatInput');
            const container = document.getElementById('chatMessages');
            const text = input.value.trim();

            if (!text) return;

            // User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = text;
            container.appendChild(userDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // AI Response Logic
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai';

                const lower = text.toLowerCase();
                if (lower.includes('pgvcl')) {
                    aiDiv.textContent = "PGVCL ke filhal 2 active tenders chal rahe hain: Kamlabaug Substation meter replacement (₹5 Lakh) aur City Division computer maintenance (₹1.70 Lakh). Right side list mein check karein!";
                } else if (lower.includes('irrigation') || lower.includes('sinchai')) {
                    aiDiv.textContent = "Irrigation department ke bade tenders active hain: Barada Ghed Package-3 (₹115.20 Cr) aur Sorthi Ghed Rubber Dam project (₹26.09 Cr).";
                } else {
                    aiDiv.textContent = `Aapne "${text}" pucha hai. Aap right side mein department filter ya search box use karke sabhi Porbandar tenders dekh sakte hain aur direct WhatsApp par share kar sakte hain!`;
                }

                container.appendChild(aiDiv);
                container.scrollTop = container.scrollHeight;
            }, 600);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendUserMessage();
        }

        // Initial Load
        renderTenders(tendersData);
    </script>
</body>
</html>
