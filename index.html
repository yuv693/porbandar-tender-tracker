<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>પોરબંદર ટેન્ડર & PGVCL ટ્રેકર</title>
    
    <!-- 🔔 OneSignal Web Push SDK Integration -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "d8fc9ddd-dffb-488a-8e7a-b502c07c66c6",
          safari_web_id: "web.onesignal.auto.00000000-0000-0000-0000-000000000000",
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>

    <style>
        :root {
            --bg-primary: #121212;
            --bg-card: #1e1e1e;
            --accent: #10a37f;
            --text: #ffffff;
            --text-sub: #b3b3b3;
            --whatsapp: #25d366;
            --border: #333333;
            --btn-blue: #2563eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-primary); color: var(--text); padding: 15px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.4rem; color: #fff; margin-bottom: 5px; }
        
        .whatsapp-group-banner {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--whatsapp);
            color: #000;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .controls input, .controls select {
            flex: 1; padding: 10px; background: var(--bg-card); border: 1px solid var(--border);
            color: #fff; border-radius: 8px; outline: none; font-size: 0.9rem; min-width: 140px;
        }

        .tender-list { display: flex; flex-direction: column; gap: 15px; }
        .tender-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .tender-title { font-weight: 600; font-size: 1rem; color: #fff; }
        .tender-id-tag {
            font-size: 0.8rem; background: #2d2d2d; color: var(--accent);
            padding: 4px 8px; border-radius: 4px; display: inline-block; width: fit-content;
        }
        .tender-details { font-size: 0.85rem; color: var(--text-sub); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        
        .actions { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
        .btn {
            padding: 8px 10px; border-radius: 6px; font-size: 0.8rem;
            border: none; cursor: pointer; text-decoration: none; font-weight: bold;
            display: inline-flex; align-items: center; justify-content: justify; gap: 5px;
        }
        .btn-wa { background: var(--whatsapp); color: #000; flex: 1; min-width: 120px; }
        .btn-copy { background: #2a2a2a; color: #fff; border: 1px solid var(--border); }
        .btn-portal { background: var(--btn-blue); color: #fff; text-decoration: none; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 20px;
            font-size: 0.85rem; display: none; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .loading { text-align: center; color: var(--accent); padding: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ પોરબંદર ટેન્ડર & PGVCL ટ્રેકર</h1>
        <p style="font-size:0.8rem; color: var(--accent);">રોજિંદા લાઈવ સરકારી ટેન્ડર અપડેટ્સ</p>
        
        <a href="https://chat.whatsapp.com/DJfj7DiGrg0DzegprDfKJU" target="_blank" rel="noopener noreferrer" class="whatsapp-group-banner">
            📲 વોટ્સએપ ગ્રુપમાં જોડાઓ (Join Group)
        </a>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="શોધો (કામનું નામ, વિભાગ, ID...)" oninput="filterData()">
        
        <select id="deptSelect" onchange="filterData()">
            <option value="ALL">બધા વિભાગો (All Depts)</option>
            <option value="PGVCL">PGVCL</option>
            <option value="GETCO">GETCO</option>
            <option value="IRRIGATION">સિંચાઈ (Irrigation)</option>
            <option value="R&B">માર્ગ & મકાન (R&B)</option>
            <option value="PMC">નગરપાલિકા (PMC)</option>
        </select>

        <select id="monthSelect" onchange="filterData()">
            <option value="ALL">બધા મહિનાઓ</option>
            <option value="THIS_MONTH">આ મહિને પૂર્ણ થતા</option>
            <option value="NEXT_MONTH">આવતા મહિને પૂર્ણ થતા</option>
        </select>
    </div>

    <div class="tender-list" id="tenderContainer">
        <div class="loading">લાઈવ ટેન્ડર લોડ થઈ રહ્યા છે...</div>
    </div>

    <div class="toast" id="toast">કોપી થઈ ગયું!</div>

    <script>
        let allTenders = [];

        async function loadLiveTenders() {
            try {
                const response = await fetch('tenders.json?cache=' + new Date().getTime());
                if (!response.ok) throw new Error("JSON file load nahi hui");
                allTenders = await response.json();
                renderTenders(allTenders);
            } catch (error) {
                console.error("Error loading tenders:", error);
                document.getElementById('tenderContainer').innerHTML = `
                    <div style="text-align:center; color:#f87171; padding:20px;">
                        ટેન્ડર ડેટા લોડ કરવામાં ભૂલ આવી રહી છે. કૃપા કરીને 'tenders.json' ફાઇલ તપાસો.
                    </div>
                `;
            }
        }

        function renderTenders(items) {
            const container = document.getElementById('tenderContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;">કોઈ ટેન્ડર મળ્યા નથી.</div>';
                return;
            }

            items.forEach(t => {
                const tenderId = t.id || 'N/A';
                const tenderTitle = t.title || 'વિગત ઉપલબ્ધ નથી';
                const deptName = t.dept || t.department || 'ગુજરાત સરકાર';
                const tenderCost = t.cost || t.amount || 'N/A';
                const dueDate = t.date || t.last_date || 'N/A';

                const portalUrl = (t.link && t.link.startsWith('http')) ? t.link : 'https://tender.nprocure.com/';

                const textToShare = `🚨 *પોરબંદર ટેન્ડર અપડેટ* 🚨\n\n🆔 *ટેન્ડર ID:* ${tenderId}\n📌 *કામનું નામ:* ${tenderTitle}\n🏛️ *ખાતું/વિભાગ:* ${deptName}\n💰 *અંદાજિત રકમ:* ${tenderCost}\n📅 *છેલ્લી તારીખ:* ${dueDate}\n\n🔗 *પોર્ટલ લિંક:* ${portalUrl}\n\n👉 *ટીપ:* પોર્ટલ પર જઈને ટેન્ડર ID *${tenderId}* સર્ચ કરો.`;
                
                const card = document.createElement('div');
                card.className = 'tender-card';
                card.innerHTML = `
                    <div class="tender-title">${tenderTitle}</div>
                    <div class="tender-id-tag">🆔 ટેન્ડર ID: <strong>${tenderId}</strong></div>
                    <div class="tender-details">
                        <span>વિભાગ: <strong>${deptName}</strong></span>
                        <span>અંદાજિત રકમ: <strong>${tenderCost}</strong></span>
                    </div>
                    <div class="tender-details">
                        <span>છેલ્લી તારીખ: <strong>${dueDate}</strong></span>
                    </div>
                    <div class="actions">
                        <button class="btn btn-copy" onclick="copyText('${encodeURIComponent(tenderTitle)}', 'નામ કોપી થઈ ગયું!')">📋 નામ કોપી કરો</button>
                        <button class="btn btn-copy" onclick="copyText('${encodeURIComponent(tenderId)}', 'ID કોપી થઈ ગયો!')">🔑 ID કોપી કરો</button>
                        <a href="${portalUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-portal">🌐 પોર્ટલ ખોલો ↗</a>
                        <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(textToShare)}" target="_blank" rel="noopener noreferrer" class="btn btn-wa">💬 વોટ્સએપ શેર</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyText(encodedStr, msg) {
            const text = decodeURIComponent(encodedStr);
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.innerText = msg;
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const dept = document.getElementById('deptSelect').value;
            const monthFilter = document.getElementById('monthSelect').value;

            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const nextMonth = (currentMonth + 1) % 12;
            const nextMonthYear = currentMonth === 11 ? currentYear + 1 : currentYear;

            const filtered = allTenders.filter(t => {
                const tDept = (t.dept || t.department || '').toLowerCase();
                const idMatch = (t.id || '').toLowerCase().includes(query);
                const titleMatch = (t.title || '').toLowerCase().includes(query);
                const deptMatch = tDept.includes(query);
                const matchQuery = idMatch || titleMatch || deptMatch;

                const matchDept = (dept === 'ALL' || tDept.includes(dept.toLowerCase()));

                let matchMonth = true;
                const dateStr = t.date || t.last_date;
                if (monthFilter !== 'ALL' && dateStr) {
                    const tenderDate = new Date(dateStr);
                    if (!isNaN(tenderDate.getTime())) {
                        if (monthFilter === 'THIS_MONTH') {
                            matchMonth = (tenderDate.getMonth() === currentMonth && tenderDate.getFullYear() === currentYear);
                        } else if (monthFilter === 'NEXT_MONTH') {
                            matchMonth = (tenderDate.getMonth() === nextMonth && tenderDate.getFullYear() === nextMonthYear);
                        }
                    }
                }

                return matchQuery && matchDept && matchMonth;
            });

            renderTenders(filtered);
        }

        loadLiveTenders();
    </script>
</body>
</html>
