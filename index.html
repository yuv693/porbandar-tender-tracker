<!DOCTYPE html>
<html lang="gu">
<<link rel="manifest" href="manifest.json">>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porbandar Tender & PGVCL Tracker</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-card: #1e1e1e;
            --accent: #10a37f;
            --text: #ffffff;
            --text-sub: #b3b3b3;
            --whatsapp: #25d366;
            --border: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-primary); color: var(--text); padding: 15px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.4rem; color: #fff; margin-bottom: 5px; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .controls input, .controls select {
            flex: 1; padding: 10px; background: var(--bg-card); border: 1px solid var(--border);
            color: #fff; border-radius: 8px; outline: none; font-size: 0.9rem;
        }

        .tender-list { display: flex; flex-direction: column; gap: 15px; }
        .tender-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .tender-title { font-weight: 600; font-size: 1rem; color: #fff; }
        .tender-details { font-size: 0.85rem; color: var(--text-sub); display: flex; justify-content: space-between; }
        
        .actions { display: flex; gap: 10px; margin-top: 5px; }
        .btn {
            padding: 8px 12px; border-radius: 6px; font-size: 0.85rem;
            border: none; cursor: pointer; text-decoration: none; font-weight: bold;
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-wa { background: var(--whatsapp); color: #000; flex: 1; }
        .btn-copy { background: #333; color: #fff; border: 1px solid var(--border); }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 20px;
            font-size: 0.85rem; display: none; z-index: 100;
        }
        .loading { text-align: center; color: var(--accent); padding: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Porbandar Govt & PGVCL Tenders</h1>
        <p style="font-size:0.8rem; color: var(--accent);">Live Sync with Automatic JSON Feed</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search (PGVCL, Barda, Road...)" oninput="filterData()">
        <select id="deptSelect" onchange="filterData()">
            <option value="ALL">All Depts</option>
            <option value="PGVCL">PGVCL</option>
            <option value="IRRIGATION">Irrigation</option>
            <option value="R&B">R&B</option>
            <option value="PMC">PMC / Nagarpalika</option>
        </select>
    </div>

    <div class="tender-list" id="tenderContainer">
        <div class="loading">Live Tenders Load Ho Rahe Hain...</div>
    </div>

    <div class="toast" id="toast">Details copied to clipboard!</div>

    <script>
        let allTenders = [];

        // 🚀 LIVE JSON FETCHING FROM REPOSITORY
        async function loadLiveTenders() {
            try {
                // Cache bypass ke liye timestamp add kiya hai taaki hamesha fresh data mile
                const response = await fetch('tenders.json?cache=' + new Date().getTime());
                if (!response.ok) {
                    throw new Error("JSON file load nahi hui");
                }
                allTenders = await response.json();
                renderTenders(allTenders);
            } catch (error) {
                console.error("Error loading tenders:", error);
                document.getElementById('tenderContainer').innerHTML = `
                    <div style="text-align:center; color:#f87171; padding:20px;">
                        Tenders load karne mein error aaya. Kripya check karein ki 'tenders.json' file exist karti hai ya nahi.
                    </div>
                `;
            }
        }

        function renderTenders(items) {
            const container = document.getElementById('tenderContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;">Koi tender nahi mila.</div>';
                return;
            }

            items.forEach(t => {
                const textToShare = `🚨 *Porbandar Tender Alert*\n\n📌 *Work:* ${t.title}\n🏢 *Dept:* ${t.dept}\n💰 *Cost:* ${t.cost}\n📅 *Due Date:* ${t.date}\n🔗 *Link:* ${t.link}`;
                
                const card = document.createElement('div');
                card.className = 'tender-card';
                card.innerHTML = `
                    <div class="tender-title">${t.title}</div>
                    <div class="tender-details">
                        <span>Dept: <strong>${t.dept}</strong></span>
                        <span>Cost: <strong>${t.cost}</strong></span>
                    </div>
                    <div class="tender-details">
                        <span>Due Date: <strong>${t.date}</strong></span>
                    </div>
                    <div class="actions">
                        <button class="btn btn-copy" onclick="copyText('${encodeURIComponent(textToShare)}')">📋 Copy</button>
                        <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(textToShare)}" target="_blank" class="btn btn-wa">💬 WhatsApp Share</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyText(encodedStr) {
            const text = decodeURIComponent(encodedStr);
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const dept = document.getElementById('deptSelect').value;

            const filtered = allTenders.filter(t => {
                const matchQuery = t.title.toLowerCase().includes(query) || t.dept.toLowerCase().includes(query);
                const matchDept = (dept === 'ALL' || t.dept === dept);
                return matchQuery && matchDept;
            });

            renderTenders(filtered);
        }

        // App start hote hi live data fetch karo
        loadLiveTenders();
    </script>
</body>
</html>
